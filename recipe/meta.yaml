{% set version = "7.5" %}

package:
  name: robotframework-split
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/r/robotframework/robotframework-{{ version }}.tar.gz
    sha256: ff6233ff752a200ece4d0a6c59f6f9f7d0e96dcff0a7a3458296b997b812482e
    folder: dist
  - url: https://github.com/robotframework/robotframework/archive/v{{ version }}.tar.gz
    sha256: 839070f2612be5ae7519f6e4f77b19fc7c8e4ea0b873e802019dbb12efa9428b
    folder: src

build:
  number: 0
  skip: true  # [py<38]

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools
  run:
    - python

outputs:
  - name: robotframework
    build:
      script:
        - cd dist
        - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
      entry_points:
        - robot = robot.run:run_cli
        - rebot = robot.rebot:rebot_cli
        - libdoc = robot.libdoc:libdoc_cli
    requirements:
      host:
        - pip
        - python
        - wheel
        - setuptools
      run:
        - python
    test:
      requires:
        - pip
      imports:
        - robot
        - robot.api
        - robot.conf
        - robot.htmldata
        - robot.libdocpkg
        - robot.libraries
        - robot.model
        - robot.output
        - robot.output.console
        - robot.parsing
        - robot.reporting
        - robot.result
        - robot.running
        - robot.running.arguments
        - robot.running.timeouts
        - robot.utils
        - robot.variables
      commands:
        - pip check
        # the `--version` commands return rc 251
        # - robot --version
        # - rebot --version
        # - libdoc --version
        # generate simple test file (`echo` and `>>` are cross-platform)
        - echo "*** Test Cases ***"                   >> test-{{ version }}.robot  # [unix]
        - echo "Hello World"                          >> test-{{ version }}.robot  # [unix]
        - echo "    Log   %{PKG_NAME} %{PKG_VERSION}" >> test-{{ version }}.robot  # [unix]
        # on win the quotes are rendered in the files, and they would be incorrect test files
        - echo *** Test Cases *** >> test-{{ version }}.robot  # [win]
        - echo|(set /p="Hello World    Log   %%{PKG_NAME} %%{PKG_VERSION}" & echo.) >> test-{{ version }}.robot  # [win]
        # smoke test
        - robot test-{{ version }}.robot
        - rebot output.xml
        - libdoc test-{{ version }}.robot test.html

  - name: _robotframework_tests
    requirements:
      host:
        - pip
        - python
        - wheel
        - setuptools
      run:
        - python
        - {{ pin_subpackage('robotframework', exact=True) }}
    test:
      requires:
        - docutils >=0.10
        - jsonschema
        - lxml
        - markdown
        - pillow
        - pip
        - pygments
        - pyyaml
        - typing_extensions >=4.13
      imports:
        - robot
      source_files:
        - src/utest
        - src/atest
        # win does not copy this one only subfolder
        - src/atest/testresources  # [win]
        - src/doc/schema
        - src/README.rst
      commands:
        - pip check
        - cd src
        - cd utest
        - python run.py
      about:
        license: Apache-2.0
        license_family: Apache
        license_file:
          - dist/LICENSE.txt
          - dist/COPYRIGHT.txt
        summary: >
          A package for the tests assets of `robotframework`: should not normally be needed.

about:
  home: https://robotframework.org
  license: Apache-2.0
  license_family: Apache
  license_file:
    - dist/LICENSE.txt
    - dist/COPYRIGHT.txt
  summary: Generic automation framework for acceptance testing and robotic process automation (RPA)
  doc_url: https://robotframework.org/robotframework/{{ version }}/RobotFrameworkUserGuide.html
  dev_url: https://github.com/robotframework/robotframework
  description: >
    Robot Framework is a generic open source automation framework for acceptance testing, acceptance test driven development (ATDD), and robotic process automation (RPA). It has simple plain text syntax and it can be extended easily with libraries implemented using Python or Java.

extra:
  feedstock-name: robotframework
  recipe-maintainers:
    - abloemert
    - bollwyvl
